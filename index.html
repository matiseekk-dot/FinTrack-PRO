<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#060b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinTrack PRO" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="FinTrack PRO — tracker finansów osobistych z cyklem rozliczeniowym pod dzień wypłaty. Live kursy NBP, import wyciągów z 8 banków, kalkulator IKZE/IKE/PPK." />
    <meta property="og:title" content="FinTrack PRO" />
    <meta property="og:description" content="Tracker finansów z cyklem pod wypłatę, live kursami NBP i importem CSV z 8 banków PL." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://matiseekk-dot.github.io/FinTrack-PRO/" />
    <title>FinTrack PRO</title>
    <link rel="manifest" href="/FinTrack-PRO/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/FinTrack-PRO/icon.svg" />
    <link rel="apple-touch-icon" href="/FinTrack-PRO/icon.svg" />
    <style>* { -webkit-tap-highlight-color: transparent; } body { background: #060b14; }</style>
    <!-- Analytics: GoatCounter (privacy-first, GDPR compliant, no cookies)
         WYŁĄCZONE w v1.2.8 - placeholder 'fintrackpro' nie istnieje, zwracał 400 na każde
         otwarcie strony i zaśmiecał DevTools. Aby włączyć:
           1. Zarejestruj się na https://goatcounter.com
           2. Stwórz site z kodem (np. 'fintrack-skudev')
           3. Odkomentuj poniższy script i wstaw swój kod zamiast 'fintrackpro'
    <script data-goatcounter="https://fintrackpro.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service Worker — offline support + asset cache.
      // SW (public/sw.js) używa Network First dla HTML/JS — zawsze świeża wersja
      // gdy online, ostatnia działająca gdy offline. Stare cache są sprzątane
      // w activate event (CACHE_NAME zawiera wersję apki z __APP_VERSION__).
      // Wcześniej (pre-v1.4) SW był wyrejestrowywany tutaj — przez co PWA nie
      // miała offline mode. Teraz rejestrujemy normalnie.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/FinTrack-PRO/sw.js').catch(err => {
            console.warn('[FT] SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
